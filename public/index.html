<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheckBox — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #7c6aff;
            --accent-glow: rgba(124, 106, 255, 0.25);
            --text: #f0f0f5;
            --muted: #6b6b80;
            --error: #ff6b6b;
            --success: #6bffb8;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124, 106, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 106, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 106, 255, 0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow:
                0 0 0 1px rgba(124, 106, 255, 0.1),
                0 24px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-box {
            width: 28px;
            height: 28px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            display: grid;
            place-items: center;
        }

        .logo-box::after {
            content: '✓';
            color: var(--accent);
            font-size: 14px;
            font-family: 'DM Mono', monospace;
        }

        .tabs {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
        }

        .form {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .form.active {
            display: flex;
        }

        label {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder {
            color: var(--muted);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            opacity: 0.88;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .google-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .message {
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            display: none;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: var(--error);
            display: block;
        }

        .message.success {
            background: rgba(107, 255, 184, 0.08);
            border: 1px solid rgba(107, 255, 184, 0.2);
            color: var(--success);
            display: block;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <div class="logo-box"></div>
            CheckBox
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form class="form active" id="form-login" onsubmit="handleLogin(event)">
            <div>
                <label>Email</label>
                <input type="email" id="login-email" placeholder="your email here" required />
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="login-password" placeholder="" required />
            </div>
            <div id="login-msg" class="message"></div>
            <button type="submit" class="btn-primary" id="login-btn">Log in</button>
            <div class="divider">or continue with</div>
            <a href="/auth/google" class="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </a>
        </form>

        <form class="form" id="form-signup" onsubmit="handleSignup(event)">
            <div>
                <label>Username</label>
                <input type="text" id="signup-username" placeholder="yourname" required minlength="3" maxlength="50" />
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="you@example.com" required />
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="min 8 characters" required minlength="8" />
            </div>
            <div id="signup-msg" class="message"></div>
            <button type="submit" class="btn-primary" id="signup-btn">Create account</button>
            <div class="divider">or continue with</div>
            <a href="/auth/google" class="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </a>
        </form>
    </div>

    <script>
        (async () => {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                if (data.user) window.location.replace('/checkbox.html');
            } catch { }
        })();

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`form-${tab}`).classList.add('active');
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `message ${type}`;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg('login-msg', data.error || 'Login failed', 'error');
                } else {
                    showMsg('login-msg', `Welcome back, ${data.username}!`, 'success');
                    setTimeout(() => window.location.href = '/checkbox.html', 700);
                }
            } catch {
                showMsg('login-msg', 'Network error. Try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Log in';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg('signup-msg', data.error || 'Signup failed', 'error');
                } else {
                    showMsg('signup-msg', `Account created! Welcome, ${data.username}!`, 'success');
                    setTimeout(() => window.location.href = '/checkbox.html', 700);
                }
            } catch {
                showMsg('signup-msg', 'Network error. Try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'oidc_failed') {
            showMsg('login-msg', 'Google login failed. Try again.', 'error');
        }
    </script>
</body>

</html>
