<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox — 1,000,000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #171722;
            --border: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(124, 106, 255, 0.22);
            --accent: #7c6aff;
            --accent2: #a694ff;
            --accent-glow: rgba(124, 106, 255, 0.18);
            --text: #f0f0f5;
            --muted: #6b6b80;
            --good: #6bffb8;
            --bad: #ff6b6b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "DM Mono", monospace;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124, 106, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 106, 255, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: grid;
            grid-template-rows: 56px 1fr 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: "Syne", sans-serif;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -0.4px;
        }

        .brand-box {
            width: 22px;
            height: 22px;
            border: 2px solid var(--accent);
            border-radius: 5px;
            display: grid;
            place-items: center;
            color: var(--accent);
            font-size: 11px;
        }

        .topstats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 11px;
            color: var(--muted);
        }

        .topstats strong {
            color: var(--text);
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(124, 106, 255, 0.10);
            border: 1px solid var(--border-accent);
            color: var(--accent2);
            font-size: 11px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent2);
            animation: blink 2s ease infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.25
            }
        }

        .topactions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .uname {
            font-size: 11px;
            color: var(--muted);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-sm {
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: 7px;
            padding: 6px 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: 0.18s;
        }

        .btn-sm:hover {
            border-color: var(--border-accent);
            background: rgba(124, 106, 255, 0.10);
        }

        .btn-sm.accent {
            border-color: var(--accent);
            background: rgba(124, 106, 255, 0.13);
            color: var(--accent2);
        }

        .btn-sm.accent:hover {
            background: rgba(124, 106, 255, 0.22);
        }

        .main {
            overflow: auto;
            padding: 16px;
        }

        .main::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        .main::-webkit-scrollbar-thumb {
            background: rgba(124, 106, 255, 0.22);
            border-radius: 999px;
        }

        .panel {
            background: rgba(18, 18, 26, 0.70);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .panel-head strong {
            color: var(--text);
        }

        .ws-badge {
            font-size: 11px;
        }

        .ws-badge.ok {
            color: var(--good);
        }

        .ws-badge.err {
            color: var(--bad);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(40, 18px);
            gap: 5px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .cb {
            appearance: none;
            -webkit-appearance: none;

            width: 18px;
            height: 18px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.025);

            border-radius: 3px;
            cursor: pointer;

            transition: transform 0.07s, background 0.07s, border-color 0.07s;
        }

        .cb:checked {
            background: #7c6aff;
            border-color: #7c6aff;
        }

        .cb:hover {
            border-color: rgba(124, 106, 255, 0.5);
            background: rgba(124, 106, 255, 0.12);
            transform: scale(1.15);
            z-index: 2;
            position: relative;
        }


        .cb.pop {
            animation: pop 0.16s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.3)
            }

            100% {
                transform: scale(1)
            }
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 18px;
            border-top: 1px solid var(--border);
            background: rgba(18, 18, 26, 0.95);
            font-size: 11px;
            color: var(--muted);
        }

        .pbar {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .pbar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.25s;
            border-radius: 999px;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            background: var(--bg);
            transition: opacity 0.2s;
        }

        #loading.out {
            opacity: 0;
            pointer-events: none;
        }

        .spin-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 12px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 80;
            display: grid;
            place-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s;
        }

        .backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border-accent);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 0 1px rgba(124, 106, 255, 0.1), 0 20px 70px rgba(0, 0, 0, 0.75);
            transform: translateY(14px) scale(0.98);
            transition: transform 0.22s ease;
            position: relative;
        }

        .backdrop.open .auth-card {
            transform: translateY(0) scale(1);
        }

        .card-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 5px;
            line-height: 1;
            transition: color 0.15s;
        }

        .card-close:hover {
            color: var(--text);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .card-icon {
            width: 34px;
            height: 34px;
            border: 1.5px solid var(--border-accent);
            border-radius: 9px;
            display: grid;
            place-items: center;
            font-size: 16px;
            background: rgba(124, 106, 255, 0.08);
            flex-shrink: 0;
        }

        .card-header-text h3 {
            font-family: "Syne", sans-serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
        }

        .card-header-text p {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: "DM Mono", monospace;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s;
            margin-bottom: 14px;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .g-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 14px;
            gap: 2px;
        }

        .auth-tab {
            flex: 1;
            padding: 6px;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--muted);
            font-family: "DM Mono", monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.18s;
        }

        .auth-tab.on {
            background: var(--accent);
            color: #fff;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .auth-form.on {
            display: flex;
        }

        .field label {
            font-size: 9px;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 9px 11px;
            color: var(--text);
            font-family: "DM Mono", monospace;
            font-size: 12px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .field input::placeholder {
            color: var(--muted);
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: "Syne", sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.18s, transform 0.1s;
            margin-top: 2px;
        }

        .btn-submit:hover {
            opacity: 0.87;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .flash {
            font-size: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            display: none;
        }

        .flash.err {
            display: block;
            background: rgba(255, 107, 107, 0.10);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: var(--bad);
        }

        .flash.ok {
            display: block;
            background: rgba(107, 255, 184, 0.08);
            border: 1px solid rgba(107, 255, 184, 0.2);
            color: var(--good);
        }
    </style>
</head>

<body>

    <div id="loading">
        <div class="spin-wrap">
            <div class="spinner"></div>
            <span id="load-txt">Building grid...</span>
        </div>
    </div>

    <div class="backdrop" id="backdrop">
        <div class="auth-card">
            <button class="card-close" onclick="closeAuth()">✕</button>

            <div class="card-header">
                <div class="card-header-text">
                    <h3>Join to participate</h3>
                    <p>Sign in and your click goes through instantly.</p>
                </div>
            </div>

            <a href="/auth/google" class="btn-google">
                <svg class="g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </a>

            <div class="or-divider">or use email</div>

            <div class="auth-tabs">
                <button class="auth-tab on" id="tab-l" onclick="switchTab('l')">Login</button>
                <button class="auth-tab" id="tab-s" onclick="switchTab('s')">Sign Up</button>
            </div>

            <div class="auth-form on" id="form-l">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="l-email" placeholder="your Email here" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="l-pw" placeholder="" />
                </div>
                <div class="flash" id="l-msg"></div>
                <button class="btn-submit" id="l-btn" onclick="doLogin()">Log in</button>
            </div>

            <div class="auth-form" id="form-s">
                <div class="field">
                    <label>Username</label>
                    <input type="text" id="s-name" placeholder="yourname" minlength="3" maxlength="50" />
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="s-email" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="s-pw" placeholder="min 8 characters" minlength="8" />
                </div>
                <div class="flash" id="s-msg"></div>
                <button class="btn-submit" id="s-btn" onclick="doSignup()">Create account</button>
            </div>
        </div>
    </div>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-box">✓</div>
                Checkbox
            </div>

            <div class="topstats">
                <span>Checked: <strong id="st-count">0</strong></span>
                <span>of <strong>1,000,000</strong></span>
                <div class="live-pill">
                    <div class="live-dot"></div>
                    <span id="st-clients">0</span> online
                </div>
            </div>

            <div class="topactions">
                <span class="uname" id="uname"></span>
                <button class="btn-sm accent" id="btn-in" onclick="openAuth()" style="display:none">Sign in</button>
                <button class="btn-sm" id="btn-out" onclick="doLogout()" style="display:none">Logout</button>
            </div>
        </header>

        <main class="main">
            <div class="panel">
                <div class="panel-head">
                    <span><strong>1,000,000</strong> checkboxes — click any to participate</span>
                    <span class="ws-badge err" id="ws-st">● disconnected</span>
                </div>
                <div class="grid" id="grid"></div>
            </div>
        </main>

        <footer class="footer">
            <span id="ft-txt">0 / 1,000,000</span>
            <div class="pbar">
                <div class="pbar-fill" id="pbar"></div>
            </div>
            <span id="ft-pct">0%</span>
        </footer>
    </div>

    <script>
        const TOTAL = 2000;

        const S = {
            user: null,
            ws: null,
            wsOk: false,
            pending: null,
        };

        const $ = id => document.getElementById(id);
        const grid = $("grid");
        const backdrop = $("backdrop");
        const loading = $("loading");

        function hideLoad() {
            loading.classList.add("out");
            setTimeout(() => loading.remove(), 220);
        }

        function setCount(n) {
            $("st-count").textContent = n.toLocaleString();
            $("ft-txt").textContent = `${n.toLocaleString()} / ${TOTAL.toLocaleString()}`;
            const p = ((n / TOTAL) * 100).toFixed(4);
            $("ft-pct").textContent = p + "%";
            $("pbar").style.width = p + "%";
        }

        function setWs(ok) {
            const el = $("ws-st");
            el.textContent = ok ? "● connected" : "● disconnected";
            el.className = "ws-badge " + (ok ? "ok" : "err");
        }

        function applyUser(u) {
            S.user = u;
            if (u) {
                $("uname").textContent = u.username || u.email || "";
                $("btn-in").style.display = "none";
                $("btn-out").style.display = "block";
            } else {
                $("uname").textContent = "";
                $("btn-in").style.display = "block";
                $("btn-out").style.display = "none";
            }
        }

        function openAuth() { backdrop.classList.add("open"); }
        function closeAuth() { backdrop.classList.remove("open"); S.pending = null; }

        backdrop.addEventListener("click", e => { if (e.target === backdrop) closeAuth(); });

        function switchTab(t) {
            ["l", "s"].forEach(x => {
                $(`tab-${x}`).classList.toggle("on", x === t);
                $(`form-${x}`).classList.toggle("on", x === t);
            });
        }

        function flash(id, txt, type) {
            const el = $(id);
            el.textContent = txt;
            el.className = `flash ${type}`;
        }

        async function doLogin() {
            const btn = $("l-btn");
            const email = $("l-email").value.trim();
            const pw = $("l-pw").value;
            if (!email || !pw) return flash("l-msg", "All fields required", "err");

            btn.disabled = true; btn.textContent = "Logging in...";
            try {
                const r = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password: pw }),
                });
                const d = await r.json();
                if (!r.ok) { flash("l-msg", d.error || "Login failed", "err"); return; }
                applyUser(d);
                flash("l-msg", `Welcome back, ${d.username}!`, "ok");
                setTimeout(() => {
                    closeAuth();
                    if (S.pending !== null) { sendToggle(S.pending); S.pending = null; }
                }, 550);
            } catch { flash("l-msg", "Network error", "err"); }
            finally { btn.disabled = false; btn.textContent = "Log in"; }
        }

        async function doSignup() {
            const btn = $("s-btn");
            const uname = $("s-name").value.trim();
            const email = $("s-email").value.trim();
            const pw = $("s-pw").value;
            if (!uname || !email || !pw) return flash("s-msg", "All fields required", "err");
            if (pw.length < 8) return flash("s-msg", "Password min 8 chars", "err");

            btn.disabled = true; btn.textContent = "Creating...";
            try {
                const r = await fetch("/api/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: uname, email, password: pw }),
                });
                const d = await r.json();
                if (!r.ok) { flash("s-msg", d.error || "Signup failed", "err"); return; }
                applyUser(d);
                flash("s-msg", `Welcome, ${d.username}!`, "ok");
                setTimeout(() => {
                    closeAuth();
                    if (S.pending !== null) { sendToggle(S.pending); S.pending = null; }
                }, 550);
            } catch { flash("s-msg", "Network error", "err"); }
            finally { btn.disabled = false; btn.textContent = "Create account"; }
        }

        async function doLogout() {
            await fetch("/api/logout", { method: "POST" });
            applyUser(null);
        }

        (function buildGrid() {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < TOTAL; i++) {
                const d = document.createElement("input");
                d.type = "checkbox";
                d.className = "cb";
                d.dataset.i = i;
                frag.appendChild(d);
            }
            grid.appendChild(frag);
        })();

        grid.addEventListener("change", e => {
            const cell = e.target;
            if (!cell.classList.contains("cb")) return;
            if (!cell) return;
            const idx = parseInt(cell.dataset.i, 10);
            if (!S.user) { S.pending = idx; openAuth(); return; }
            sendToggle(idx);
        });

        function markCell(idx, val) {
            const el = grid.children[idx];
            if (!el) return;
            el.checked = !!val;
            el.classList.remove("pop");
            void el.offsetWidth;
            el.classList.add("pop");
        }

        function sendToggle(idx) {
            if (!S.ws || !S.wsOk) return;
            S.ws.send(JSON.stringify({ type: "toggle", index: idx }));
        }

        function connect() {
            const proto = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(`${proto}//${location.host}`);
            S.ws = ws; S.wsOk = false; setWs(false);

            ws.onopen = () => { S.wsOk = true; setWs(true); };
            ws.onmessage = e => {
                let m; try { m = JSON.parse(e.data); } catch { return; }
                if (m.type === "init") {
                    hideLoad();

                    const bytes = Uint8Array.from(atob(m.bits), c => c.charCodeAt(0));

                    for (let i = 0; i < TOTAL; i++) {
                        const byte = bytes[Math.floor(i / 8)];
                        const bit = (byte >> (i % 8)) & 1;

                        if (bit) markCell(i, 1);
                    }
                }
                if (m.type === "update") { markCell(m.index, m.value); if (m.count != null) setCount(m.count); }
            };
            ws.onclose = () => { S.wsOk = false; setWs(false); setTimeout(connect, 2000); };
            ws.onerror = () => { try { ws.close(); } catch { } };
        }

        async function poll() {
            try {
                const d = await fetch("/api/stats").then(r => r.json());
                if (d.checked != null) setCount(d.checked);
                if (d.clients != null) $("st-clients").textContent = d.clients;
            } catch { }
        }

        (async () => {
            try {
                const d = await fetch("/api/me").then(r => r.json());
                applyUser(d.user || null);
            } catch { applyUser(null); }

            const p = new URLSearchParams(location.search);
            if (p.get("auth") === "ok") {
                try { const d = await fetch("/api/me").then(r => r.json()); if (d.user) applyUser(d.user); } catch { }
                history.replaceState({}, "", location.pathname);
            }
            if (p.get("error") === "oidc_failed") {
                openAuth();
                setTimeout(() => flash("l-msg", "Google login failed. Try again.", "err"), 80);
                history.replaceState({}, "", location.pathname);
            }

            connect();
            poll();
            setInterval(poll, 10000);
        })();
    </script>
</body>

</html>
